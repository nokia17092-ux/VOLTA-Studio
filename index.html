// VOLTA STUDIO — a whole DAW in the page. render() draws nothing; onMount builds the studio once:
// WebAudio synths + drum kit, lookahead sequencer, piano roll, channel rack, song strip, MIDI in/out, WAV render.
function render(ctx, player) { return ''; }

const PPQ = 96, BAR = PPQ * 4;
const NN = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const BLACK = [0,1,0,1,0,0,1,0,1,0,1,0];
const DRUMS = {35:'Kick 2',36:'Kick',37:'Rim',38:'Snare',39:'Clap',40:'Snare 2',41:'Tom Low',42:'Hat Closed',43:'Tom Low 2',44:'Hat Pedal',45:'Tom Mid',46:'Hat Open',47:'Tom Mid 2',48:'Tom High',49:'Crash',50:'Tom High 2',51:'Ride',52:'China',53:'Ride Bell',54:'Tambourine',55:'Splash',56:'Cowbell',57:'Crash 2',59:'Ride 2',70:'Shaker',75:'Claves'};

const hz = m => 440 * Math.pow(2, (m - 69) / 12);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const noteName = m => NN[m % 12] + (Math.floor(m / 12) - 1);

// ───────────────────────── synthesis ─────────────────────────
const CACHE = new WeakMap();
function res(ac) {
  let r = CACHE.get(ac);
  if (!r) {
    r = { waves: {}, shapers: {} };
    const len = ac.sampleRate * 2, b = ac.createBuffer(1, len, ac.sampleRate), d = b.getChannelData(0);
    let s = 22222;
    for (let i = 0; i < len; i++) { s = (s * 1103515245 + 12345) & 0x7fffffff; d[i] = s / 0x3fffffff - 1; }
    r.noise = b; CACHE.set(ac, r);
  }
  return r;
}
function pwave(ac, name) {
  const r = res(ac); if (r.waves[name]) return r.waves[name];
  const N = 48, re = new Float32Array(N), im = new Float32Array(N);
  if (name === 'piano') { const a = [0,1,.62,.34,.26,.15,.11,.075,.05,.034,.024,.017,.012,.008]; for (let i = 1; i < a.length; i++) im[i] = a[i]; }
  if (name === 'pulse') { for (let n = 1; n < N; n++) re[n] = (2 / (n * Math.PI)) * Math.sin(n * Math.PI * 0.25); }
  if (name === 'reed') { for (let n = 1; n < 20; n++) im[n] = (n % 2 ? 1 : 0.35) / Math.pow(n, 1.1); }
  return (r.waves[name] = ac.createPeriodicWave(re, im));
}
function shaper(ac, k) {
  const r = res(ac); if (r.shapers[k]) return r.shapers[k];
  const c = new Float32Array(1024); for (let i = 0; i < 1024; i++) { const x = i / 511.5 - 1; c[i] = Math.tanh(x * k) / Math.tanh(k); }
  return (r.shapers[k] = c);
}
function WS(ac, k) { const w = ac.createWaveShaper(); w.curve = shaper(ac, k); w.oversample = '2x'; return w; }
function O(ac, type, f, t, det) { const o = ac.createOscillator(); if (typeof type === 'string') o.type = type; else o.setPeriodicWave(type); o.frequency.value = f; if (det) o.detune.value = det; o.start(t); return o; }
function G(ac, v) { const g = ac.createGain(); g.gain.value = v == null ? 1 : v; return g; }
function F(ac, type, f, q) { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q != null) b.Q.value = q; return b; }
function P(ac, v) { const p = ac.createStereoPanner(); p.pan.value = v || 0; return p; }
function NZ(ac, t, dur) { const s = ac.createBufferSource(); s.buffer = res(ac).noise; s.loop = true; s.start(t, Math.random() * 1.5); if (dur) s.stop(t + dur); return s; }
function adsr(g, t, v, a, d, s) { const p = g.gain; p.setValueAtTime(0, t); p.linearRampToValueAtTime(v, t + a); p.setTargetAtTime(v * s, t + a, Math.max(0.002, d / 3)); }
function fin(srcs, g, t0, a, r) {
  return te => {
    te = Math.max(te, t0 + a + 0.012);
    const p = g.gain; p.cancelScheduledValues(te); p.setTargetAtTime(0, te, Math.max(0.004, r / 4));
    const end = te + r * 1.8 + 0.05; for (const s of srcs) { try { s.stop(end); } catch (e) {} }
  };
}
function vib(ac, t, rate, depth, delay, targets) {
  const l = O(ac, 'sine', rate, t), lg = G(ac, 0); lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(depth, t + delay);
  l.connect(lg); for (const o of targets) lg.connect(o.frequency); return l;
}
function stack(ac, t, f, type, dets, out, spread) {
  return dets.map((d, i) => { const o = O(ac, type, f, t, d); const pn = P(ac, spread ? (i / (dets.length - 1 || 1) * 2 - 1) * spread : 0); o.connect(pn).connect(out); return o; });
}

const INST = {
  piano: { name: 'Grand Piano', rev: .26, dly: 0, fn(ac, out, m, t, v) {

    const o1 = O(ac, w, f, t, -2.5), o2 = O(ac, w, f * 1.0006, t, 3), o3 = O(ac, 'sine', f * 2.003, t), g3 = G(ac, .1);
    o1.connect(lp); o2.connect(lp); o3.connect(g3).connect(lp); lp.connect(g);

    const n = NZ(ac, t, .06), bp = F(ac, 'bandpass', Math.min(9000, f * 3.5), 1), hg = G(ac, 0);

  epiano: { name: 'Velvet Keys', rev: .22, dly: .08, fn(ac, out, m, t, v) {

    const mod = O(ac, 'sine', f, t), mg = G(ac, 0); mg.gain.setValueAtTime(f * (1.2 + 2.6 * v), t); mg.gain.setTargetAtTime(f * .35, t, .45);
    const tine = O(ac, 'sine', f * 14, t), tg = G(ac, 0); tg.gain.setValueAtTime(f * 1.1 * v, t); tg.gain.setTargetAtTime(0, t, .018);
    mod.connect(mg); mg.connect(car.frequency); mg.connect(car2.frequency); tine.connect(tg); tg.connect(car.frequency);

    const sub = O(ac, 'sine', f / 2, t), sg = G(ac, .22); sub.connect(sg).connect(lp);
    mix.connect(lp).connect(g).connect(out); adsr(g, t, .9 * (.4 + .6 * v), .006, .35, .72);

  pad: { name: 'Nebula Pad', rev: .55, dly: .12, fn(ac, out, m, t, v) {

  } },
  bass: { name: 'Deep Sub', rev: 0, dly: 0, fn(ac, out, m, t, v) {
    const f = hz(m), g = G(ac, 0), s = O(ac, 'sine', f, t), saw = O(ac, 'sawtooth', f, t, 4), lp = F(ac, 'lowpass', 180 + 500 * v, 1.2), sg = G(ac, .35);
    lp.frequency.setTargetAtTime(160, t + .01, .15); saw.connect(sg).connect(lp); s.connect(lp); const d = WS(ac, 1.6); lp.connect(d).connect(g).connect(out);
    adsr(g, t, .62 * (.5 + .5 * v), .005, .25, .8);
    return fin([s, saw], g, t, .005, .09);
  } },
  boom808: { name: '808 Boom', rev: 0, dly: 0, fn(ac, out, m, t, v) {
    const f = hz(m), g = G(ac, 0), s = O(ac, 'sine', f, t); s.frequency.setValueAtTime(f * 2.4, t); s.frequency.exponentialRampToValueAtTime(f, t + .07);

  acid: { name: 'Acid 303', rev: .12, dly: .22, fn(ac, out, m, t, v) {

  pluck: { name: 'Crystal Pluck', rev: .35, dly: .28, fn(ac, out, m, t, v) {
    const f = hz(m), g = G(ac, 0), lp = F(ac, 'lowpass', Math.min(16000, f * 9 + 3000 * v), 1.5), mix = G(ac, .2);
    lp.frequency.setTargetAtTime(f * 1.4, t + .002, .07);
    const os = stack(ac, t, f, 'sawtooth', [-7, 7], mix, .5); const sq = O(ac, 'square', f * 2, t), qg = G(ac, .06); sq.connect(qg).connect(lp);
    mix.connect(lp).connect(g).connect(out);

  bell: { name: 'Glass Bell', rev: .45, dly: .2, fn(ac, out, m, t, v) {

    const f = hz(m), g = G(ac, 0), o = O(ac, 'sine', f, t), o2 = O(ac, 'triangle', f * 2, t), g2 = G(ac, .12);
    const n = NZ(ac, t), bp = F(ac, 'bandpass', f * 2, 2.5), ng = G(ac, 0); ng.gain.setValueAtTime(.35, t); ng.gain.setTargetAtTime(.06, t + .04, .1);
    n.connect(bp).connect(ng).connect(g); o2.connect(g2).connect(g); o.connect(g); const lf = vib(ac, t, 5.1, f * .007, .4, [o, o2]);

#volta .btn:hover{background:#322a4a;border-color:#4a3f6e}
#volta .btn:active{transform:translateY(1px)}
#volta .btn.on{background:linear-gradient(#ff4f9a,#c2336f);border-color:#ff7fb6;box-shadow:0 0 14px #ff4f9a66}
#volta .btn.cy.on{background:linear-gradient(#38e1ff,#1a8fb0);border-color:#8cf0ff;color:#041018;box-shadow:0 0 14px #38e1ff66}
#volta .tp{width:40px;height:36px;font-size:16px;display:grid;place-items:center;padding:0}
#volta .play.on{background:linear-gradient(#57f287,#1f9e4c);border-color:#9dffbf;color:#03140a;box-shadow:0 0 16px #57f28777}
#volta .rec.on{background:linear-gradient(#ff5a4a,#b3261a);border-color:#ff9d93;box-shadow:0 0 16px #ff5a4a88;animation:vrec 1s infinite}
@keyframes vrec{50%{opacity:.6}}
#volta .lcd{background:#07060c;border:1px solid #2b2540;border-radius:8px;padding:4px 12px;min-width:150px;text-align:center;box-shadow:inset 0 0 18px #38e1ff22}
#volta .lcd b{display:block;font-size:22px;color:var(--b);text-shadow:0 0 10px #38e1ff99;font-weight:normal;letter-spacing:.06em}
#volta .lcd i{font-style:normal;font-size:10px;color:var(--mu);letter-spacing:.2em}
#volta .fld{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;color:var(--mu);letter-spacing:.14em}
#volta .num{width:62px;background:#07060c;border:1px solid #2b2540;border-radius:6px;padding:4px 6px;text-align:center;color:var(--c);font-size:16px;cursor:ns-resize}
#volta select{background:var(--p3);border:1px solid var(--ln);border-radius:6px;padding:4px 6px;cursor:pointer}
#volta .sep{width:1px;align-self:stretch;background:var(--ln);margin:0 2px}
#volta .grow{flex:1}
#volta #vspec{height:38px;width:180px;border-radius:8px;background:#07060c;border:1px solid #2b2540}
#volta .main{flex:1;display:flex;gap:8px;min-height:0}

#volta .trk{display:flex;gap:8px;background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:7px;cursor:pointer;position:relative}

#volta .sw{width:6px;border-radius:4px;background:var(--c2);box-shadow:0 0 10px var(--c2)}
#volta .tm{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
#volta .r1{display:flex;gap:4px;align-items:center}

#volta .tname:focus{border-color:var(--ln);background:#07060c;outline:none}
#volta .sm{width:22px;height:22px;padding:0;font-size:11px;border-radius:5px;display:grid;place-items:center}
#volta .sm.m.on{background:#ff6b4a;border-color:#ffa08a;box-shadow:none;color:#1a0500}
#volta .sm.s.on{background:#f7e04b;border-color:#fff08a;box-shadow:none;color:#1a1500}
#volta .tinst{width:100%;font-size:12px}

#volta input[type=range]::-moz-range-track{height:4px;border-radius:3px;background:#0a0812}
#volta input[type=range]::-moz-range-progress{height:4px;border-radius:3px;background:var(--c2,#38e1ff)}
#volta input[type=range]::-moz-range-thumb{width:10px;height:10px;border:0;border-radius:50%;background:#fff}
#volta .add{margin:6px;padding:9px;border:1px dashed #4a3f6e;border-radius:10px;text-align:center;cursor:pointer;color:var(--mu)}

#volta canvas{display:block}

#volta .tools .btn{padding:4px 8px;font-size:11px;background:#1c1829e8}
